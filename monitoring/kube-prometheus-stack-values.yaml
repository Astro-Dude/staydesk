# kube-prometheus-stack: Prometheus Operator + Prometheus + Alertmanager + Grafana
# + kube-state-metrics + node-exporter.
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from every namespace, not only ones labelled for this release
    # (the StayDesk chart ships its own ServiceMonitor in the staydesk namespace).
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 2d
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1Gi}

alertmanager:
  enabled: false   # not part of this capstone; keeps the footprint small

grafana:
  enabled: true
  # Admin password is generated by the chart and stored in a Secret:
  #   kubectl get secret -n monitoring kube-prometheus-stack-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL         # the StayDesk dashboard ConfigMap lives in "staydesk"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  defaultDashboardsTimezone: browser

kube-state-metrics:
  # Needed for the HPA panels (kube_horizontalpodautoscaler_*).
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/component]
