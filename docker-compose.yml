# Full local stack: PostgreSQL + FastAPI backend + React/Nginx frontend.
#   docker compose up --build      -> UI on http://localhost:3000, API docs on http://localhost:8000/docs
#   docker compose down -v         -> stop and delete the database volume
# Credentials below are local-development defaults; override them (and host ports, if 3000/8000/5432
# are taken) via a .env file — see .env.example.
name: staydesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staydesk}
      POSTGRES_USER: ${POSTGRES_USER:-staydesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staydesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: staydesk-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-staydesk}:${POSTGRES_PASSWORD:-staydesk}@postgres:5432/${POSTGRES_DB:-staydesk}
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GIT_SHA: ${GIT_SHA:-local}
    image: staydesk-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
