{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
# Only backend pods (app + migration initContainer) may open connections to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "staydesk.fullname" . }}-postgres
  labels:
    {{- include "staydesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "staydesk.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "staydesk.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
