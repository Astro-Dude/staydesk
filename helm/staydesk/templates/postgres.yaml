{{- if .Values.postgres.enabled }}
{{- $component := dict "ctx" . "component" "postgres" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "staydesk.fullname" . }}-postgres
  labels:
    {{- include "staydesk.componentLabels" $component | nindent 4 }}
spec:
  clusterIP: None   # headless: stable DNS for the StatefulSet pod
  selector:
    {{- include "staydesk.selectorLabels" $component | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "staydesk.fullname" . }}-postgres
  labels:
    {{- include "staydesk.componentLabels" $component | nindent 4 }}
spec:
  serviceName: {{ include "staydesk.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "staydesk.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "staydesk.componentLabels" $component | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70      # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70        # make the volume writable for that user
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "staydesk.dbSecretName" . }}
          env:
            # Sub-directory: a fresh EBS volume contains lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "staydesk.selectorLabels" $component | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
