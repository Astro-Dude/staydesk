{{- $component := dict "ctx" . "component" "frontend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "staydesk.fullname" . }}-frontend
  labels:
    {{- include "staydesk.componentLabels" $component | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "staydesk.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "staydesk.componentLabels" $component | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "staydesk.selectorLabels" $component | nindent 14 }}
      containers:
        - name: frontend
          image: {{ include "staydesk.frontendImage" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # Nginx proxies /api here when the UI is reached without the Ingress
            # (e.g. kubectl port-forward); through the Ingress /api goes straight to the backend.
            - name: BACKEND_URL
              value: {{ printf "http://%s-backend:%v" (include "staydesk.fullname" .) .Values.backend.port | quote }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          securityContext:
            {{- include "staydesk.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # Read-only root filesystem: nginx only writes its rendered config and temp files.
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
