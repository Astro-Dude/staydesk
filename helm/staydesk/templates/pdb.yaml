{{- range $component := list "backend" "frontend" }}
{{- $cfg := index $.Values $component }}
{{- if $cfg.podDisruptionBudget.enabled }}
---
# Keeps at least one pod serving during node drains (e.g. EKS node group upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "staydesk.fullname" $ }}-{{ $component }}
  labels:
    {{- include "staydesk.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "staydesk.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
