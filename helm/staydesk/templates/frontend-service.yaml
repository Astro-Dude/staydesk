apiVersion: v1
kind: Service
metadata:
  name: {{ include "staydesk.fullname" . }}-frontend
  labels:
    {{- include "staydesk.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "staydesk.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
