apiVersion: v1
kind: Service
metadata:
  name: {{ include "staydesk.fullname" . }}-backend
  labels:
    {{- include "staydesk.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "staydesk.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http   # the ServiceMonitor scrapes /metrics on this named port
      port: {{ .Values.backend.port }}
      targetPort: http
