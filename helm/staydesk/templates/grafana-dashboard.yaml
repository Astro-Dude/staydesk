{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Discovered by the Grafana sidecar (kube-prometheus-stack) via the grafana_dashboard label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "staydesk.fullname" . }}-grafana-dashboard
  labels:
    {{- include "staydesk.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    grafana_folder: StayDesk
data:
  staydesk-overview.json: |-
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
{{- end }}
