{{- /*
DATABASE_URL for the backend. With the bundled PostgreSQL the password is generated once
and then read back from the live Secret on every upgrade, so it never changes underneath
the database volume.
*/ -}}
{{- $secretName := include "staydesk.dbSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgres.password -}}
{{- if and (not $password) $existing -}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "staydesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.username $password (include "staydesk.fullname" .) .Values.postgres.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url | quote }}
  {{- end }}
