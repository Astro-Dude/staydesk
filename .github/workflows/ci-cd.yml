name: StayDesk CI/CD

# TEST  ->  BUILD + TRIVY SCAN + PUSH (GHCR)  ->  DEPLOY (Helm -> ephemeral kind, Helm -> EKS)
#
# Every image is tagged with the commit SHA, so a running pod can always be traced back
# to the exact commit that produced it. Pull requests run tests, builds and scans but
# never push or deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: v0.75.0

jobs:
  # ---------------------------------------------------------------- TEST
  backend-test:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # A failing test exits non-zero, which fails this job and blocks every job after it:
      # no image is built, scanned, pushed or deployed from broken code.
      - name: Run pytest
        run: pytest -v --cov --cov-config=.coveragerc --cov-fail-under=85

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_GIT_SHA: ${{ github.sha }}

  iac-scan:
    name: Security · IaC misconfiguration report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Report-only: surfaces Terraform / Helm / Dockerfile misconfigurations in the log
      # without blocking the pipeline. The image scans below are the hard gate.
      - name: Trivy config scan (Terraform, Helm, Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ---------------------------------------------------- BUILD + SCAN + PUSH
  build-scan-push:
    name: Image · ${{ matrix.component }}
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR names must be lowercase; the repository owner (Astro-Dude) is not.
      - name: Compute image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${owner}/staydesk-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (tag = commit SHA)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Hard gate: any HIGH or CRITICAL vulnerability that has a fix available fails the
      # job, so the image is never pushed. Unfixed CVEs are reported but can't be acted on.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          {
            echo "### ${{ matrix.component }} image"
            echo ""
            echo "\`$IMAGE:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------- DEPLOY (ephemeral)
  # Proves on every push to main that the Helm chart deploys the exact images this run just
  # published: a throwaway 3-node kind cluster on the runner, Traefik as Ingress Controller,
  # `helm upgrade --install`, rollout wait, then smoke tests through the Ingress. The cluster
  # disappears with the runner, so it costs nothing and needs no cloud credentials.
  deploy-kind:
    name: Deploy · Helm → kind (ephemeral)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          config: k8s/kind-config.yaml
          cluster_name: staydesk
          wait: 120s

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Install Traefik ingress controller
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm upgrade --install traefik traefik/traefik --version 42.0.0 \
            -n traefik --create-namespace -f k8s/ingress/traefik-values-kind.yaml \
            --wait --timeout 5m

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load the SHA-tagged images from GHCR into the cluster
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for component in backend frontend; do
            image="${REGISTRY}/${owner}/staydesk-${component}:${{ github.sha }}"
            docker pull "$image"
            kind load docker-image --name staydesk "$image"
          done

      - name: Helm upgrade --install
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install staydesk ./helm/staydesk \
            --namespace staydesk \
            -f helm/staydesk/values-dev.yaml \
            --set backend.image.repository="${REGISTRY}/${owner}/staydesk-backend" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.repository="${REGISTRY}/${owner}/staydesk-frontend" \
            --set frontend.image.tag="${{ github.sha }}" \
            --wait --timeout 6m --rollback-on-failure

      - name: Smoke test through the Ingress
        run: |
          ./scripts/smoke-test.sh http://staydesk.localhost
          meta="$(curl -s http://staydesk.localhost/api/meta)"
          echo "$meta"
          # The running API must report the commit this pipeline built.
          echo "$meta" | grep -q '"git_sha":"${{ github.sha }}"'

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployed \`${{ github.sha }}\` to an ephemeral kind cluster"
            echo '```'
            helm list -n staydesk
            echo
            kubectl get pods,svc,ingress,hpa -n staydesk -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get events -n staydesk --sort-by=.lastTimestamp | tail -40
          kubectl describe pods -n staydesk | tail -80
          kubectl logs -n staydesk -l app.kubernetes.io/component=backend --all-containers --tail=50

  # ---------------------------------------------------------------- DEPLOY
  # Runs once the AWS infrastructure exists: after `terraform apply`, set the repository
  # variables AWS_DEPLOY_ROLE_ARN (terraform output github_deploy_role_arn), AWS_REGION and
  # EKS_CLUSTER_NAME. Until then the job is skipped and the pipeline stays green.
  deploy:
    name: Deploy · Helm → EKS
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no long-lived keys in GitHub
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'staydesk-eks' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Helm upgrade --install
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install staydesk ./helm/staydesk \
            --namespace staydesk --create-namespace \
            -f helm/staydesk/values-prod.yaml \
            --set backend.image.repository="${REGISTRY}/${owner}/staydesk-backend" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.repository="${REGISTRY}/${owner}/staydesk-frontend" \
            --set frontend.image.tag="${{ github.sha }}" \
            --wait --timeout 10m --rollback-on-failure

      - name: Verify rollout
        run: |
          kubectl -n staydesk rollout status deploy/staydesk-backend --timeout=180s
          kubectl -n staydesk rollout status deploy/staydesk-frontend --timeout=180s
          kubectl -n staydesk get pods -o wide
          {
            echo "### Deployed \`${{ github.sha }}\` to \`$EKS_CLUSTER_NAME\`"
            echo '```'
            helm list -n staydesk
            kubectl -n staydesk get deploy,svc,ingress,hpa
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
