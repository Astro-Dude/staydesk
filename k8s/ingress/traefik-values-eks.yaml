# Traefik as the Ingress Controller on EKS, exposed through an AWS Network Load Balancer.
#   kubectl get svc -n traefik traefik   -> EXTERNAL-IP is the public NLB hostname
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
deployment:
  replicas: 2
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
