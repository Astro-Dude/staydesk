# Local 3-node cluster that mirrors the EKS layout (control plane + 2 workers).
#   kind create cluster --config k8s/kind-config.yaml
# The ingress controller (Traefik) listens on NodePorts 30080/30443, mapped to host 80/443,
# so http://staydesk.localhost reaches the Ingress without /etc/hosts edits.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: staydesk
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 80, protocol: TCP}
      - {containerPort: 30443, hostPort: 443, protocol: TCP}
  - role: worker
  - role: worker
